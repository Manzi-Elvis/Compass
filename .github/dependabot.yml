version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: dev
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # ADR 0002: stay on TypeScript 6 until typescript-eslint supports 7
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
